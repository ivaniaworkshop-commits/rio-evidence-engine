name: RIO R024 isolated incident drill
on:
  push:
    branches: [deploy/primer-cobro]
    paths:
      - "demos/rio-primer-cobro/frontdesk/drills/R024_TRIGGER.txt"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Source integrity
        run: python3 scripts/verify_manifest.py
      - name: Incident regression suite
        run: python3 -m unittest discover -s demos/rio-primer-cobro/frontdesk/tests -v
  inject:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: missing
        name: Deliberate exit code 47 before receipt creation
        continue-on-error: true
        run: |
          echo R024_EXPECTED_EXIT_47
          exit 47
      - name: Classify missing evidence and validate receipt
        if: always()
        env:
          FAULT_OUTCOME: ${{ steps.missing.outcome }}
        run: |
          set -euo pipefail
          test "$FAULT_OUTCOME" = "failure"
          mkdir -p output/rio-r024
          python3 demos/rio-primer-cobro/frontdesk/incident_reconcile_r023.py \
            --offline-alias-unavailable \
            --baseline output/rio-r024/no-baseline.json \
            --fence output/rio-r024/no-fence.json \
            --promote-outcome failure --output output/rio-r024/missing.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/rio-r024/missing.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          wanted={"classification":"ALIAS_UNKNOWN_MANUAL_REVIEW",
             "result":"INCIDENT_OPEN","baseline_receipt":"ABSENT",
             "fence_receipt":"ABSENT","alias_observation":"UNKNOWN",
             "promotion_step_outcome":"failure","automatic_rollback":False,
             "production_write":False,"incident_closed":False}
          assert all(d.get(k)==v for k,v in wanted.items()),"R024_MISSING_READBACK_FAILED"
          d["controlled_fault"]={"step_outcome":"failure","exit_code":47,"real_vercel_calls":False}
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print("R024_MISSING_READBACK_PASS")
          PY
          cat output/rio-r024/missing.json >> "$GITHUB_STEP_SUMMARY"
      - id: corrupt
        name: Deliberate exit code 49 with malformed receipts
        if: always()
        continue-on-error: true
        run: |
          mkdir -p output/rio-r024
          printf '{invalid' > output/rio-r024/invalid-baseline.json
          printf '{invalid' > output/rio-r024/invalid-fence.json
          echo R024_EXPECTED_EXIT_49
          exit 49
      - name: Classify invalid evidence and validate receipt
        if: always()
        env:
          FAULT_OUTCOME: ${{ steps.corrupt.outcome }}
        run: |
          set -euo pipefail
          test "$FAULT_OUTCOME" = "failure"
          python3 demos/rio-primer-cobro/frontdesk/incident_reconcile_r023.py \
            --offline-alias-unavailable \
            --baseline output/rio-r024/invalid-baseline.json \
            --fence output/rio-r024/invalid-fence.json \
            --promote-outcome failure --output output/rio-r024/corrupt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/rio-r024/corrupt.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          wanted={"classification":"EVIDENCE_CORRUPT_MANUAL_REVIEW",
             "result":"INCIDENT_OPEN","baseline_receipt":"INVALID",
             "fence_receipt":"INVALID","alias_observation":"UNKNOWN",
             "promotion_step_outcome":"failure","automatic_rollback":False,
             "production_write":False,"incident_closed":False}
          assert all(d.get(k)==v for k,v in wanted.items()),"R024_CORRUPT_READBACK_FAILED"
          d["controlled_fault"]={"step_outcome":"failure","exit_code":49,"real_vercel_calls":False}
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print("R024_CORRUPT_READBACK_PASS")
          PY
          cat output/rio-r024/corrupt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Persist two incident receipts for independent readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rio-r024-incidents
          path: |
            output/rio-r024/missing.json
            output/rio-r024/corrupt.json
          if-no-files-found: error
          retention-days: 14
