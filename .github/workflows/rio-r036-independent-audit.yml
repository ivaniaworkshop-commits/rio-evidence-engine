name: RIO R036 independent history and selected-payment privacy audit
on:
  push:
    branches:
      - candidate/primer-cobro-r035-atomic-clean-20261106
  pull_request:
    branches:
      - review-base/primer-cobro-r026-preincident-20261106
permissions:
  contents: read
jobs:
  independent-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source manifest on current checkout
        run: python3 scripts/verify_manifest.py
      - name: Test R036 with adversarial synthetic Git repositories
        run: python3 -m unittest discover -s demos/rio-primer-cobro/integrations/tests -p 'test_r036.py' -v
      - name: Verify R026 checkpoint and every subsequent snapshot; fail closed
        run: |
          python3 demos/rio-primer-cobro/integrations/verify_r036.py --output /tmp/r036-independent.json
          cat /tmp/r036-independent.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain independent audit receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rio-r036-independent-audit
          path: /tmp/r036-independent.json
          if-no-files-found: error
          retention-days: 14
