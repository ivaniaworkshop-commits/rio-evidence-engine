name: RIO R028 reviewed privacy lineage
on:
  push:
    branches:
      - security/primer-cobro-r028-clean-20261106
  pull_request:
    branches:
      - feat/primer-cobro-r016-public-frontdesk-20261106
permissions:
  contents: read
jobs:
  clean-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Manifest source integrity
        run: python3 scripts/verify_manifest.py
      - name: Verify selected source revisions since safe anchor
        run: |
          python3 demos/rio-primer-cobro/integrations/verify_privacy_lineage_r028.py \
            --output /tmp/r028-lineage.json
          cat /tmp/r028-lineage.json >> "$GITHUB_STEP_SUMMARY"
      - name: Historical-leak regression suite
        run: python3 -m unittest discover -s demos/rio-primer-cobro/integrations/tests -p 'test_privacy_lineage_r028.py' -v
      - name: R026 emulated payments
        run: node --test demos/rio-primer-cobro/tests/test_pey_r026.mjs
      - name: R027 provider evidence
        run: node --test demos/rio-primer-cobro/tests/test_pey_r027.mjs
      - name: Commercial and receipt tests
        run: python3 -m unittest discover -s demos/rio-primer-cobro/frontdesk/tests -v
      - name: Source-only packaging
        run: python3 demos/rio-primer-cobro/frontdesk/verify_release.py
