name: H00 integrity and reproducibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify complete source inventory and byte hashes
        run: python3 scripts/verify_manifest.py
      - name: Run test suite; report skips explicitly
        run: python3 -m unittest discover -s tests -v
      - name: Smoke CLI and deterministic demo
        run: |
          python3 -m rio_evidence schedule examples/schedule.json
          python3 -m rio_evidence compare examples/compare.json
          python3 demo.py
      - name: Audit H07 historical paired source and metadata
        run: python3 scripts/h07_audit.py
      - name: H09 enumerate exact extension gain against incumbent
        run: python3 scripts/evaluate_extended_graph.py
      - name: H10 language shift paired probe (authored, not hidden)
        run: python3 scripts/evaluate_language_shift.py
      - name: H11 execute registered systems on same authored diagnostic
        run: |
          python3 scripts/h11_run_paired.py > /tmp/h11_blocked.json
          python3 scripts/h11_run_paired.py --diagnostic --candidate h09 > /tmp/h11_h09.json
          python3 scripts/h11_run_paired.py --diagnostic --candidate legacy > /tmp/h11_legacy.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/h11_blocked.json'))
          b=json.load(open('/tmp/h11_h09.json'))
          c=json.load(open('/tmp/h11_legacy.json'))
          assert a['status']=='BLOCKED_NO_EVALUATION_INPUT'
          assert b['supported']==40 and b['unsupported']==12
          assert b['baseline_supported_exact']==b['candidate_supported_exact']==0
          assert b['baseline_correct_abstentions']==b['candidate_correct_abstentions']==12
          assert c['candidate_supported_exact']==0 and c['candidate_correct_abstentions']==12
          assert not b['candidate_promoted'] and not c['source_class_verified']
          print('H11_OBSERVED', {k:b[k] for k in ['cases','supported','unsupported','candidate_wins','candidate_losses','baseline_observed_median_ms','candidate_observed_median_ms','candidate_promoted']})
          PY
      - name: H12 exact power and seeded Monte Carlo assumptions
        run: |
          python3 scripts/h12_power.py > /tmp/h12.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/h12.json'))
          a=next(v for v in x['rows'] if v['assumed_single_case_win_probability']==0.1)
          assert a['n_for_at_least_80pct_under_assumptions']==66
          assert abs(a['exact_probability_of_at_least_five_wins_in_30']-0.17549487903389513)<1e-12
          assert x['design_effect_example']['effective_n_heuristic']<14
          assert x['candidate_promoted'] is False
          print('H12_MATH',{'p10_n80':a['n_for_at_least_80pct_under_assumptions'],'p10_power30':a['exact_probability_of_at_least_five_wins_in_30'],'simulated_probability':a['monte_carlo_30_cases_20000_draws']})
          PY
      - name: H13 receipt consistency and no false promotion
        run: python3 -m unittest discover -s tests -p test_evaluation_receipts.py -v
      - name: H14 structured candidate authored development probe
        run: |
          python3 scripts/h14_development_probe.py > /tmp/h14.json
          python3 scripts/h11_run_paired.py --diagnostic --candidate structured_v1 > /tmp/h14_h11.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/h14.json'))
          r=json.load(open('/tmp/h14_h11.json'))
          assert d['candidate_supported_exact']==5 and d['baseline_supported_exact']==0
          assert d['candidate_correct_abstentions']==12
          assert r['supported']==40 and r['unsupported']==12
          assert r['candidate_supported_exact']==5 and r['baseline_supported_exact']==0
          assert r['candidate_correct_abstentions']==r['baseline_correct_abstentions']==12
          assert r['candidate_wins']==5 and r['candidate_losses']==0
          assert r['cluster_wins']==1 and not r['preliminary_engineering_screen']
          assert not r['candidate_promoted'] and not r['source_class_verified']
          print('H14_OBSERVED_DEV',{'supported':r['supported'],'baseline_exact':r['baseline_supported_exact'],'candidate_exact':r['candidate_supported_exact'],'correct_abstentions':r['candidate_correct_abstentions'],'cluster_wins':r['cluster_wins'],'candidate_median_ms':r['candidate_observed_median_ms'],'baseline_median_ms':r['baseline_observed_median_ms'],'promotion':r['candidate_promoted']})
          PY
      - name: H14 verify frozen baseline and candidate byte identity
        run: |
          python3 scripts/h14_verify_freeze.py > /tmp/h14_freeze.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/h14_freeze.json'))
          assert r['status']=='FROZEN_SOURCE_BYTES_MATCH_LOCAL_RECEIPT'
          assert not r['candidate_promoted'] and not r['external_evaluator_authenticated']
          print('H14_FREEZE_READBACK', {k:r[k] for k in ['status','candidate_sha256','baseline_sha256']})
          PY
      - name: H17 bounded rejection and paired latency probe
        run: python3 scripts/h17_rejection_latency.py
      - name: H08 independence gate must fail closed without external data
        run: |
          python3 -m rio_evidence.independent_gate > /tmp/h08.json
          python3 -c 'import json; x=json.load(open("/tmp/h08.json")); assert x["status"]=="BLOCKED_NO_EXTERNAL_HOLDOUT" and x["candidate_promoted"] is False'
  strict-torch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify source before installing dependencies
        run: python3 scripts/verify_manifest.py
      - name: Install declared optional CPU runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r model/requirements-cpu.txt
          .venv/bin/python -c 'import torch; print("torch", torch.__version__)'
      - name: Run complete suite; reject every skip
        run: .venv/bin/python scripts/run_strict_tests.py
      - name: H17 unified checkpoint API and CLI smoke
        run: .venv/bin/python scripts/h17_program_probe.py
      - name: H07 remeasure paired accuracy abstention and latency
        run: |
          .venv/bin/python scripts/evaluate_network_value.py
          .venv/bin/python scripts/h07_audit.py
