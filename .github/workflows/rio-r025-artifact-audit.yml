name: RIO R025 independent Github artifact audit
on:
  push:
    branches: [deploy/primer-cobro]
    paths:
      - "demos/rio-primer-cobro/frontdesk/audit/R025_TRIGGER.txt"
permissions:
  contents: read
  actions: read
jobs:
  independent-auditor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check exact source inventory
        run: python3 scripts/verify_manifest.py
      - name: Independent auditor adversarial unit tests
        run: python3 -m unittest discover -s demos/rio-primer-cobro/frontdesk/audit -v
      - name: Download original R024 evidence directly from GitHub API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/rio-r025
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/42199945830" > output/rio-r025/run.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13492779462" > output/rio-r025/metadata.json
          gh api --allow-escape-sequences "/repos/${GITHUB_REPOSITORY}/actions/artifacts/13492779462/zip" > output/rio-r025/source-artifact.zip
          gh api --allow-escape-sequences "/repos/${GITHUB_REPOSITORY}/actions/jobs/127832534471/logs" > output/rio-r025/source-job.log
      - name: Verify digest, exact contents, provenance and real failed-step logs
        shell: bash
        run: |
          set -euo pipefail
          python3 demos/rio-primer-cobro/frontdesk/audit/audit_github_artifact_r025.py \
            --zip output/rio-r025/source-artifact.zip \
            --metadata output/rio-r025/metadata.json \
            --run output/rio-r025/run.json \
            --job-log output/rio-r025/source-job.log \
            --output output/rio-r025/independent-audit.json
          cat output/rio-r025/independent-audit.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve auditor receipt independently
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rio-r025-independent-audit
          path: output/rio-r025/independent-audit.json
          if-no-files-found: error
          retention-days: 14
